<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F7F5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ava" />
  <title>ava</title>
  <link rel="stylesheet" href="product.css?v=10" />
  <link rel="preload" as="image" href="assets/3d/his-tray.webp" type="image/webp">
</head>
<body>
  <main class="phone">
    <section id="view-home" class="view on">
      <div class="topbar">
        <div class="mark">ava</div>
        <div class="pill">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.4-3.2 3.8-4.8 7-4.8s5.6 1.6 7 4.8"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7.5v.5"/></svg>
        </div>
      </div>
      <div class="hero-copy">
        <h1>august</h1>
        <p id="count">13 receipts in the drawer</p>
      </div>
      <div class="drawer">
        <img class="oak" src="assets/3d/his-tray.webp" width="900" height="759" alt="August drawer">
        <div class="well" id="well"></div>
      </div>
      <div class="section">
        <h2>the boxes</h2>
        <div class="boxes" id="boxes"></div>
      </div>
    </section>

    <section id="view-cat" class="view">
      <button class="back" id="back-home" type="button">‹ August</button>
      <div class="cat-head">
        <h1 id="cat-title">groceries</h1>
        <p id="cat-sub"></p>
      </div>
      <div class="drawer">
        <img class="oak" id="cat-shot" src="assets/3d/his-tray.webp" width="900" height="759" alt="">
        <div class="well" id="cat-well"></div>
      </div>
      <div class="slips-row" id="cat-slips"></div>
    </section>

    <section id="view-detail" class="view">
      <div class="topbar">
        <button class="back" id="detail-back" type="button">‹ August</button>
        <button class="ghost" id="detail-done" type="button">Done</button>
      </div>
      <div class="detail">
        <img class="paper" id="detail-img" src="assets/3d/slip-ottimo.webp" alt="">
      </div>
    </section>

    <nav class="tabbar">
      <button class="tab on" id="home-tab" data-view="home" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
        Home
      </button>
      <button class="fab" id="new-tab" type="button" aria-label="New receipt">+</button>
      <button class="tab" id="boxes-tab" data-view="cat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
        Boxes
      </button>
    </nav>
  </main>

  <div class="sheet" id="sheet">
    <div class="panel">
      <div class="grab"></div>
      <div class="sheet-top">
        <button class="ghost" id="cancel" type="button">Cancel</button>
        <h3>New receipt</h3>
        <span></span>
      </div>
      <div class="field">
        <label>Merchant</label>
        <div class="chips" id="chips">
          <button class="chip" type="button" data-m="Ottimo Pizza">Ottimo</button>
          <button class="chip" type="button" data-m="Trader Joe's">Trader Joe’s</button>
          <button class="chip" type="button" data-m="Blue Bottle">Blue Bottle</button>
          <button class="chip" type="button" data-m="Uber">Uber</button>
          <button class="chip" type="button" data-m="IKEA">IKEA</button>
          <button class="chip" type="button" data-m="Whole Foods">Whole Foods</button>
        </div>
      </div>
      <div class="field">
        <label>Amount</label>
        <div class="amt">₹<span id="amt">0.00</span></div>
        <div class="keys" id="keys">
          <button type="button">1</button><button type="button">2</button><button type="button">3</button>
          <button type="button">4</button><button type="button">5</button><button type="button">6</button>
          <button type="button">7</button><button type="button">8</button><button type="button">9</button>
          <button type="button">.</button><button type="button">0</button><button type="button" data-k="del">⌫</button>
        </div>
      </div>
      <div class="field">
        <label>Which box</label>
        <div class="pick-grid" id="pick">
          <button type="button" data-cat="groceries"><img src="assets/3d/his-tray.webp" alt="Groceries"></button>
          <button type="button" data-cat="coffee"><img src="assets/3d/his-tray.webp" alt="Coffee"></button>
          <button type="button" data-cat="rides"><img src="assets/3d/his-tray.webp" alt="Rides"></button>
          <button type="button" data-cat="home"><img src="assets/3d/his-tray.webp" alt="Home"></button>
        </div>
      </div>
      <button class="save" id="save" type="button">Print into the drawer</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="product.js?v=10"></script>
</body>
</html>
