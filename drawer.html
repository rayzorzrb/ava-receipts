<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf9f5" />
  <title>ava — august</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone">
    <div class="topbar">
      <a class="brand" href="index.html">ava</a>
      <div class="tools">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.2" stroke="#1a1814" stroke-width="1.7"/>
          <path d="M5 19c1.4-3.2 3.8-4.8 7-4.8s5.6 1.6 7 4.8" stroke="#1a1814" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <button class="js-info" aria-label="about this version">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8.2" stroke="#1a1814" stroke-width="1.7"/>
            <path d="M12 11v5" stroke="#1a1814" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="8.2" r="1" fill="#1a1814"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="info-pop">august as a drawer of thermal slips. tap a receipt for the full sheet; tap a box to open that category.</div>
    <div class="page-head">
      <h1>august</h1>
      <p class="caption" id="count-line">13 receipts in the drawer</p>
    </div>

    <div class="gingham-stage">
      <div class="drawer-box kraft">
        <div class="drawer-well" id="drawer"></div>
      </div>
    </div>

    <div class="section-label">the boxes</div>
    <div class="boxes-grid" id="boxes"></div>
  </main>
  <script src="app.js"></script>
  <script>
    const { RECEIPTS, DRAWER_LAYOUT, miniHTML, peekHTML, HEART, CLIP, SEAL, TOMATO, CUP,
            inCategory, sum, money, showSheet, showBox, wireInfo } = AVA;

    const drawer = document.getElementById("drawer");
    RECEIPTS.forEach((r, i) => {
      const pos = DRAWER_LAYOUT[i] || { top: "40%", left: "40%", rot: 0 };
      drawer.insertAdjacentHTML("beforeend", miniHTML(r));
      const el = drawer.lastElementChild;
      el.style.top = pos.top;
      el.style.left = pos.left;
      el.style.transform = `rotate(${pos.rot}deg)`;
      el.style.zIndex = String(1 + i);
    });
    drawer.insertAdjacentHTML("beforeend", HEART + CLIP + SEAL);

    drawer.addEventListener("click", (e) => {
      const card = e.target.closest("[data-id]");
      if (!card) return;
      const r = RECEIPTS.find((x) => x.id === card.dataset.id);
      if (r) showSheet(r);
    });

    function catBox(cat, extra, peek) {
      const list = inCategory(cat);
      const peeks = list.slice(0, 3).map((r, i) =>
        peekHTML(r, `top:${10 + i * 14}%; left:${8 + i * 16}%; transform:rotate(${-8 + i * 7}deg); z-index:${i}`)
      ).join("");
      return `<button class="cat-box kraft ${peek ? "peek" : ""}" data-cat="${cat}" type="button">
        <div class="cat-well">
          ${peeks}
          ${extra || ""}
          <div class="cat-meta">${cat.toUpperCase()}<br><span class="amt">${money(sum(list))} x${list.length}</span></div>
        </div>
      </button>`;
    }

    document.getElementById("boxes").innerHTML =
      catBox("groceries", TOMATO, false) +
      catBox("coffee", CUP, false) +
      catBox("rides", "", true) +
      catBox("home", "", true);

    document.getElementById("boxes").addEventListener("click", (e) => {
      const box = e.target.closest("[data-cat]");
      if (box) showBox(box.dataset.cat);
    });

    wireInfo("august as a drawer of thermal slips. tap a receipt for the full sheet; tap a box to open that category.");
  </script>
</body>
</html>
