<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf9f5" />
  <title>ava — sort</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone">
    <div class="topbar">
      <a class="brand" href="index.html">ava</a>
      <div class="tools">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.2" stroke="#1a1814" stroke-width="1.7"/>
          <path d="M5 19c1.4-3.2 3.8-4.8 7-4.8s5.6 1.6 7 4.8" stroke="#1a1814" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <button class="js-info" aria-label="about this version">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8.2" stroke="#1a1814" stroke-width="1.7"/>
            <path d="M12 11v5" stroke="#1a1814" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="8.2" r="1" fill="#1a1814"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="info-pop">drag a slip onto a box, or tap a slip then a box. works with a finger.</div>
    <div class="page-head">
      <h1>sort</h1>
      <p class="caption" id="count-line">uncategorized receipts</p>
    </div>
    <p class="sort-hint">drag onto a box, or tap a slip then the box it belongs in.</p>

    <div class="gingham-stage">
      <div class="drawer-box kraft">
        <div class="drawer-well sort-pile" id="pile"></div>
      </div>
    </div>

    <div class="dock" id="dock"></div>
  </main>
  <script src="app.js"></script>
  <script>
    const KEY = "ava-sort-v1";
    const { RECEIPTS, CATEGORIES, miniHTML, peekHTML, money, sum, wireInfo, toast } = AVA;

    const PILE_LAYOUT = [
      { top: "4%", left: "6%", rot: -14 },
      { top: "6%", left: "36%", rot: 9 },
      { top: "3%", left: "64%", rot: -6 },
      { top: "26%", left: "2%", rot: 11 },
      { top: "28%", left: "32%", rot: -10 },
      { top: "24%", left: "58%", rot: 5 },
      { top: "48%", left: "8%", rot: 7 },
      { top: "52%", left: "38%", rot: -8 },
      { top: "46%", left: "66%", rot: 13 },
      { top: "68%", left: "4%", rot: -4 },
      { top: "66%", left: "34%", rot: 8 },
      { top: "70%", left: "62%", rot: -11 },
      { top: "74%", left: "20%", rot: 3 },
    ];

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {
        pile: RECEIPTS.map((r) => r.id),
        boxes: { groceries: [], coffee: [], rides: [], home: [], other: [] },
      };
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

    let state = load();
    let selected = null;
    const pileEl = document.getElementById("pile");
    const dock = document.getElementById("dock");

    function rec(id) { return RECEIPTS.find((r) => r.id === id); }

    function renderDock() {
      dock.innerHTML = CATEGORIES.map((c) => {
        const list = state.boxes[c.id].map(rec).filter(Boolean);
        const peeks = list.slice(0, 2).map((r, i) =>
          peekHTML(r, `top:${8 + i * 16}%; left:${6 + i * 10}%; transform:rotate(${-6 + i * 8}deg); width:48px;`)
        ).join("");
        return `<button class="cat-box kraft" data-cat="${c.id}" type="button">
          <div class="cat-well">
            ${peeks}
            <div class="cat-meta">${c.label}<br><span class="amt">${money(sum(list))} x${list.length}</span></div>
          </div>
        </button>`;
      }).join("");
    }

    function renderPile() {
      pileEl.innerHTML = "";
      state.pile.forEach((id, i) => {
        const r = rec(id);
        if (!r) return;
        pileEl.insertAdjacentHTML("beforeend", miniHTML(r));
        const el = pileEl.lastElementChild;
        const pos = PILE_LAYOUT[i] || { top: "40%", left: "30%", rot: 0 };
        el.style.top = pos.top;
        el.style.left = pos.left;
        el.style.transform = `rotate(${pos.rot}deg)`;
        el.style.zIndex = String(1 + i);
        if (selected === id) el.classList.add("selected");
        el.dataset.rot = pos.rot;
      });
      const n = state.pile.length;
      document.getElementById("count-line").textContent =
        n === 0 ? "drawer is empty — nice." : n + " uncategorized receipt" + (n === 1 ? "" : "s");
    }

    function render() { renderPile(); renderDock(); }

    function assign(id, cat, fromEl) {
      if (!id || !cat) return;
      const idx = state.pile.indexOf(id);
      if (idx === -1) return;
      const boxBtn = dock.querySelector(`[data-cat="${cat}"]`);
      const run = () => {
        state.pile.splice(idx, 1);
        state.boxes[cat].push(id);
        selected = null;
        save();
        render();
        const label = CATEGORIES.find((c) => c.id === cat).label.toLowerCase();
        toast("tucked into " + label);
      };
      if (fromEl && boxBtn) {
        const a = fromEl.getBoundingClientRect();
        const b = boxBtn.getBoundingClientRect();
        const dx = b.left + b.width / 2 - (a.left + a.width / 2);
        const dy = b.top + b.height / 2 - (a.top + a.height / 2);
        fromEl.classList.add("tucking");
        fromEl.style.transform = `translate(${dx}px, ${dy}px) scale(0.25) rotate(8deg)`;
        fromEl.style.opacity = "0.35";
        setTimeout(run, 420);
      } else {
        run();
      }
    }

    /* pointer drag + tap-to-assign */
    let drag = null;

    pileEl.addEventListener("pointerdown", (e) => {
      const card = e.target.closest(".receipt-mini");
      if (!card) return;
      const id = card.dataset.id;
      card.setPointerCapture(e.pointerId);
      const rect = card.getBoundingClientRect();
      drag = {
        id, card,
        dx: e.clientX - rect.left,
        dy: e.clientY - rect.top,
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        rot: card.dataset.rot || 0,
      };
    });

    pileEl.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dist = Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY);
      if (dist > 8) drag.moved = true;
      if (!drag.moved) return;
      drag.card.classList.add("dragging");
      drag.card.style.position = "fixed";
      drag.card.style.left = e.clientX - drag.dx + "px";
      drag.card.style.top = e.clientY - drag.dy + "px";
      drag.card.style.right = "auto";
      drag.card.style.transform = "rotate(0deg)";
      drag.card.style.zIndex = "40";
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const box = hit && hit.closest("#dock [data-cat]");
      dock.querySelectorAll("[data-cat]").forEach((b) => b.classList.toggle("hot", b === box));
    });

    function endDrag(e) {
      if (!drag) return;
      const { id, card, moved } = drag;
      dock.querySelectorAll("[data-cat]").forEach((b) => b.classList.remove("hot"));
      if (!moved) {
        selected = selected === id ? null : id;
        drag = null;
        renderPile();
        return;
      }
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const box = hit && hit.closest("#dock [data-cat]");
      card.classList.remove("dragging");
      if (box) {
        assign(id, box.dataset.cat, card);
      } else {
        renderPile();
      }
      drag = null;
    }
    pileEl.addEventListener("pointerup", endDrag);
    pileEl.addEventListener("pointercancel", endDrag);

    dock.addEventListener("click", (e) => {
      const box = e.target.closest("[data-cat]");
      if (!box) return;
      if (selected) {
        const el = pileEl.querySelector(`[data-id="${selected}"]`);
        assign(selected, box.dataset.cat, el);
      }
    });

    render();
    wireInfo("drag a slip onto a box, or tap a slip then a box. works with a finger.");
  </script>
</body>
</html>
