<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F2F7" />
  <title>ava — studio</title>
  <link rel="stylesheet" href="apple.css" />
</head>
<body>
  <main class="phone">
    <div class="nav">
      <div class="nav-left">
        <a class="back" href="index.html" aria-label="Back">
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" aria-hidden="true">
            <path d="M10 2L2 10l8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
      <div class="nav-title">ava</div>
      <div class="nav-right"></div>
    </div>
    <div class="large-title">
      <h1>August</h1>
      <p class="sub" id="count-line">13 receipts</p>
    </div>

    <button class="hero-studio" id="hero" type="button" aria-label="Open August receipts">
      <img class="obj" src="assets/3d/box-tray.png" alt="Kraft tray of receipts" />
    </button>

    <div class="cat-grid" id="cats"></div>
  </main>
  <script src="app.js"></script>
  <script src="apple.js"></script>
  <script>
    const list = AVA2.allReceipts(false);
    document.getElementById("count-line").textContent = list.length + " receipts";

    document.getElementById("hero").addEventListener("click", () => {
      AVA2.openSheet("August", list);
    });

    const grid = document.getElementById("cats");
    grid.innerHTML = AVA2.catStats(list).map((c) => `
      <button class="cat-tile" type="button" data-cat="${c.id}">
        <img src="${c.img}" alt="${c.label}">
        <div class="cap">${c.label}</div>
        <div class="meta">${AVA2.money(c.total)} · ${c.count}</div>
      </button>`).join("");

    grid.addEventListener("click", (e) => {
      const tile = e.target.closest("[data-cat]");
      if (!tile) return;
      const cat = AVA2.CATS.find((c) => c.id === tile.dataset.cat);
      const items = AVA2.inCat(list, tile.dataset.cat);
      AVA2.openSheet(AVA2.titleCase(cat.label), items);
    });
  </script>
</body>
</html>
